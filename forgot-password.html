<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: #eef4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 34px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background:linear-gradient(135deg,#7c3aed,#a855f7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .brand span {
            font-weight: 600;
        }

        h2 {
            margin: 0 0 22px;
            text-align: center;
            font-size: 26px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fbff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 16px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="brand">
            <div class="badge">AI</div>
            <span>SmartResume AI</span>
        </div>

        <h2>Reset password</h2>

        <label>Email</label>
        <input id="email" placeholder="you@example.com">

        <button onclick="sendReset()">Send reset link</button>

        <div id="msg" class="message"></div>

        <div class="footer">
            <a href="login.html">Back to sign in</a>
        </div>

    </div>

    <script>

        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        async function sendReset() {

            const email = document.getElementById("email").value.trim();

            if (!email) {
                showMsg("Enter your email", "error");
                return;
            }

            try {

                const res = await fetch(API_BASE + "/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    showMsg("Reset email sent", "success");
                } else {
                    showMsg(data.message || "Failed", "error");
                }

            } catch (err) {
                showMsg("Network error", "error");
            }

        }

    </script>

</body>

</html>
