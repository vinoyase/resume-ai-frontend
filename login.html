<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - SmartResume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-1: #eef4ff;
            --bg-2: #f8fbff;
            --card: rgba(255, 255, 255, 0.78);
            --card-border: rgba(255, 255, 255, 0.7);
            --text: #0f172a;
            --muted: #64748b;
            --primary: #2563eb;
            --input-border: #dbe4f0;
            --input-bg: rgba(255, 255, 255, 0.92);
            --success: #16a34a;
            --error: #dc2626;
            --shadow: 0 20px 50px rgba(37, 99, 235, 0.12);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 32%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.16), transparent 28%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-wrap {
            width: 100%;
            max-width: 460px;
        }

        .box {
            width: 100%;
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 34px 32px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        h2 {
            margin: 0;
            text-align: center;
            font-size: 30px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 8px;
            color: #334155;
        }

        .field {
            margin-top: 14px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: rgba(37, 99, 235, 0.45);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #ffffff;
        }

        .extra-row {
            margin-top: 10px;
            text-align: right;
        }

        .extra-row a {
            font-size: 13px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .extra-row a:hover {
            text-decoration: underline;
        }

        .primaryBtn {
            width: 100%;
            height: 52px;
            margin-top: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.22);
        }

        .primaryBtn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            box-shadow: 0 16px 28px rgba(37, 99, 235, 0.24);
        }

        .message {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            min-height: 22px;
            font-weight: 500;
        }

        .error {
            color: var(--error);
        }

        .success {
            color: var(--success);
        }

        .bottom {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 0;
            color: var(--muted);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .trust {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .box {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-wrap">
        <div class="box">

            <div class="brand">
                <div class="brand-badge">AI</div>
                <div class="brand-name">SmartResume AI</div>
            </div>

            <h2>Welcome back</h2>
            <div class="subtitle">
                Sign in to continue building polished, professional resumes with AI.
            </div>

            <div class="field">
                <label class="label" for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" />
            </div>

            <div class="extra-row">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button class="primaryBtn" onclick="login()">Sign in</button>

            <div id="msg" class="message"></div>

            <p class="bottom">Don’t have an account? <a href="register.html">Create account</a></p>
            <div class="trust">Secure login • Fast access • Resume creation in seconds</div>

        </div>
    </div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            // 校验输入的邮箱和密码
            if (!email) {
                showMsg("Enter your email", "error");
                return;
            }

            if (!password) {
                showMsg("Enter your password", "error");
                return;
            }

            try {
                const res = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await res.json();

                // 如果登录成功
                if (res.ok) {
                    // 保存 token 到 localStorage
                    localStorage.setItem("token", data.token);

                    // 登录成功信息
                    showMsg("Login successful", "success");

                    // 判断用户是否为付费用户
                    if (data.is_paid) {
                        // 付费用户，跳转到主页
                        setTimeout(() => {
                            window.location.href = "index.html"; // 付费用户跳转到主页
                        }, 800);
                    } else {
                        // 非付费用户，提示升级
                        showMsg("You need to upgrade your account to access this feature", "error");
                    }
                } else {
                    // 登录失败，显示错误信息
                    showMsg(data.message || "Login failed", "error");
                }

            } catch (error) {
                // 网络错误处理
                showMsg("Network error", "error");
                console.error(error);
            }
        }
    </script>

</body>

</html>
