<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        p {
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Login</h2>

        <input id="email" placeholder="Email">

        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <div id="msg" class="message"></div>

        <p>Don't have an account? <a href="register.html">Register</a></p>

    </div>

    <script>

        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        async function login() {

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email) {
                showMsg("Enter email", "error");
                return;
            }

            if (!password) {
                showMsg("Enter password", "error");
                return;
            }

            try {

                const res = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", data.token);
                    showMsg("Login successful", "success");

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);

                } else {
                    showMsg(data.message || "Login failed", "error");
                }

            } catch (err) {
                showMsg("Network error", "error");
            }

        }

    </script>

</body>

</html>
