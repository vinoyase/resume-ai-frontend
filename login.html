<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1fr 420px;
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12);
        }

        .left {
            background: linear-gradient(135deg,#7dd3fc,#bae6fd);
            color: white;
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .left h1 {
            margin: 0 0 14px;
            font-size: 34px;
            line-height: 1.2;
        }

        .left p {
            margin: 0;
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.95;
        }

        .right {
            padding: 42px 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .card {
            width: 100%;
            max-width: 320px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #0f172a;
        }

        .sub {
            margin: 0 0 24px;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #0f172a;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #f8fbff;
        }

        input:focus {
            border-color: #60a5fa;
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 14px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 860px) {
            .page {
                grid-template-columns: 1fr;
            }

            .left {
                padding: 36px 28px;
            }

            .right {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="left">
            <div class="brand">SmartResume AI</div>
            <h1>Build your resume with AI</h1>
            <p>In seconds.</p>
        </div>

        <div class="right">
            <div class="card">
                <h2>Welcome</h2>
                <p class="sub">Sign in to continue.</p>

                <div class="form-group">
                    <label>Email</label>
                    <input id="email" placeholder="Email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input id="password" type="password" placeholder="Password">
                </div>

                <button onclick="login()">Sign in</button>

                <div id="msg" class="message"></div>

                <div class="footer">
                    Don’t have an account? <a href="register.html">Create account</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email) {
                showMsg("Enter email", "error");
                return;
            }

            if (!password) {
                showMsg("Enter password", "error");
                return;
            }

            try {
                const res = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", data.token);
                    showMsg("Login successful", "success");

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);
                } else {
                    showMsg(data.message || "Login failed", "error");
                }

            } catch (error) {
                showMsg("Network error", "error");
                console.error(error);
            }
        }
    </script>

</body>

</html>
