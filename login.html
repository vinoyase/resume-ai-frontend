<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - SmartResume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --card-border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --input-border: #d1d5db;
            --input-bg: #f9fafb;
            --success: #16a34a;
            --error: #dc2626;
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-wrap {
            width: 100%;
            max-width: 440px;
        }

        .box {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px 28px 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        h2 {
            margin: 0;
            text-align: center;
            font-size: 32px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 8px;
            color: #374151;
        }

        .field {
            margin-top: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: #ffffff;
        }

        .extra-row {
            margin-top: 10px;
            text-align: right;
        }

        .extra-row a {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .extra-row a:hover {
            text-decoration: underline;
        }

        .primaryBtn {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
        }

        .primaryBtn:hover {
            background: linear-gradient(135deg, #6d28d9, #7e22ce);
        }

        .message {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            min-height: 22px;
            font-weight: 500;
        }

        .error {
            color: var(--error);
        }

        .success {
            color: var(--success);
        }

        .bottom {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 0;
            color: var(--muted);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .trust {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .box {
                padding: 24px 18px 22px;
                border-radius: 16px;
            }

            h2 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-wrap">
        <div class="box">

            <div class="brand">
                <div class="brand-badge">SR</div>
                <div class="brand-name">SmartResume AI</div>
            </div>

            <h2>Welcome back</h2>


            <div class="field">
                <label class="label" for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" />
            </div>

            <div class="extra-row">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button class="primaryBtn" onclick="login()">Sign in</button>

            <div id="msg" class="message"></div>

            <p class="bottom">Don’t have an account? <a href="register.html">Create account</a></p>


        </div>
    </div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            // 校验输入的邮箱和密码
            if (!email) {
                showMsg("Enter your email", "error");
                return;
            }

            if (!password) {
                showMsg("Enter your password", "error");
                return;
            }

            try {
                const res = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await res.json();

                // 如果登录成功
                if (res.ok) {

                    // ✅ GA登录埋点
                    gtag('event', 'login', {
                        method: 'email'
                    });
                    
                    // 保存 token 到 localStorage
                    localStorage.setItem("token", data.token);

                    // 登录成功信息
                    showMsg("Login successful", "success");

                    // 检查用户的付费状态
                    localStorage.setItem("is_paid", data.is_paid);
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 600);
                } else {
                    // 登录失败，显示错误信息
                    showMsg(data.message || "Login failed", "error");
                }

            } catch (error) {
                // 网络错误处理
                showMsg("Network error", "error");
                console.error(error);
            }
        }
    </script>

</body>

</html>
