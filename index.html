<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>SmartResume</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-P7PWR77XD5');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 6px;
        }

        .error-message {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #ffeaea;
            border: 1px solid #ffb3b3;
            color: #d8000c;
        }

        .error-message button {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 14px;
            background: #d8000c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .error-message button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <h1>SmartResume</h1>

    <textarea id="inputText" placeholder="Please paste your resume content...."></textarea>
    <br />
    <button onclick="generateResume()">Generate optimized version</button>

    <div id="result"></div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com/api";

        // ✅ 页面加载时检查是否登录


        if (!token) {
            alert("Please login first.");
            window.location.href = "login.html";
        }

        async function generateResume() {
            console.log("NEW VERSION");

            const token = localStorage.getItem("token"); // 🔥 每次都重新读取

            const input = document.getElementById("inputText").value;
            const resultDiv = document.getElementById("result");

            if (!input.trim()) {
                alert("Please enter your content first.");
                return;
            }

            resultDiv.innerText = "Under optimization...";

            try {
                const response = await fetch(API_BASE + "/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token   // ✅ 关键新增
                    },
                    body: JSON.stringify({ text: input })
                });

                if (response.status === 401) {
                    alert("Session expired. Please login again.");
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }
                if (response.status === 403) {
                    resultDiv.className = "error-message";
                    resultDiv.innerHTML = `
                        <strong>Free attempts have been used up.</strong><br/>
                        Please upgrade to continue generating resumes.
                        <br/>
                        <button onclick="goToUpgrade()">Upgrade Now</button>
    `                ;
                    return;
                }
                if (!response.ok) {
                    alert("Server error.");
                    return;
                }


                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = "AI_Resume.docx";
                a.click();

                resultDiv.innerText = "Resume has been generated and downloaded. ✅";

            } catch (error) {
                alert("Network error.");
                console.error(error);
            }
        }

        function goToUpgrade() {
            window.location.href = "upgrade.html";
        }

    </script>

</body>

</html>
