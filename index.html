<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>SmartResume</title>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 6px;
        }

        .error-message {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #ffeaea;
            border: 1px solid #ffb3b3;
            color: #d8000c;
        }

        .error-message button {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 14px;
            background: #d8000c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #score {
            margin-top: 15px;
            font-weight: bold;
            color: #2b7cff;
        }
    </style>

</head>

<body>

    <h1>SmartResume</h1>

    <!-- 岗位填写 -->
    <input id="jobTitle" placeholder="Enter target position (Example: Software Test Engineer)">

    <textarea id="inputText" placeholder="Please paste your resume content..."></textarea>

    <br>

    <button onclick="generateResume()">Generate optimized version</button>

    <div id="score"></div>

    <div id="result"></div>

    <script>

        const API_BASE = "https://resume-ai-saas-4.onrender.com/api";

        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please login first");
            window.location.href = "login.html";
        }

        async function generateResume() {

            const job = document.getElementById("jobTitle").value;
            const input = document.getElementById("inputText").value;

            const resultDiv = document.getElementById("result");
            const scoreDiv = document.getElementById("score");

            if (!job.trim()) {
                alert("Please enter job title");
                return;
            }

            if (!input.trim()) {
                alert("Please paste resume content");
                return;
            }

            resultDiv.innerText = "AI optimizing resume...";
            scoreDiv.innerText = "";

            try {

                const response = await fetch(API_BASE + "/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        jobTitle: job,
                        text: input
                    })
                });

                if (response.status === 401) {
                    alert("Session expired");
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }

                if (response.status === 403) {

                    resultDiv.className = "error-message";

                    resultDiv.innerHTML = `
            <strong>Free attempts have been used up.</strong><br/>
            Please upgrade to continue generating resumes.
            <br/>
            <button onclick="goToUpgrade()">Upgrade Now</button>
            `;

                    return;
                }

                if (!response.ok) {
                    alert("Server error");
                    return;
                }

                const score = Math.floor(Math.random() * 20) + 80;

                scoreDiv.innerText = "AI Optimization Score: " + score + "%";

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                const a = document.createElement("a");

                a.href = url;
                a.download = "AI_Resume.docx";
                a.click();

                resultDiv.innerText = "Resume generated and downloaded ✅";

            } catch (error) {

                alert("Network error");
                console.error(error);

            }

        }

        function goToUpgrade() {
            window.location.href = "upgrade.html";
        }

    </script>

</body>

</html>
