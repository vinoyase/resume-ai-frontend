<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>Mini Prompt Resume</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-P7PWR77XD5');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>Mini Prompt Resume</h1>

    <textarea id="inputText" placeholder="Please paste your resume content...."></textarea>
    <br />
    <button onclick="generateResume()">Generate optimized version</button>

    <div id="result"></div>

    <script>
        async function generateResume() {
            const input = document.getElementById("inputText").value;
            const resultDiv = document.getElementById("result");

            if (!input.trim()) {
                alert("Please enter your content first.");
                return;
            }

            resultDiv.innerText = "Under optimization...";

            const response = await fetch("https://resume-ai-saas-1.onrender.com/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ text: input })
            });

            if (response.status === 403) {
                const data = await response.json();
                alert(data.message);
                return;
            }

            if (!response.ok) {
                alert("Server error.");
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "AI_Resume.docx";
            a.click();

            resultDiv.innerText = "Resume has been generated and downloaded. ✅";
        }


    </script>
<script src="auth.js"></script>
</body>

</html>
