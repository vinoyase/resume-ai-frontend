<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .codeBtn {
            background: #64748b;
        }

        .codeBtn:hover {
            background: #475569;
        }

        p {
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Register</h2>

        <input id="email" placeholder="Email">

        <button class="codeBtn" id="sendCodeBtn" onclick="sendCode()">Send Code</button>

        <input id="code" placeholder="Verification Code">

        <input id="password" type="password" placeholder="Password">

        <button onclick="register()">Register</button>

        <div id="msg" class="message"></div>

        <p>Already have an account? <a href="login.html">Login</a></p>

    </div>

    <script>

        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        let countdown = 0;
        let timer = null;

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        function startCountdown() {

            const btn = document.getElementById("sendCodeBtn");

            countdown = 60;

            btn.disabled = true;
            btn.innerText = `Resend ${countdown}s`;

            timer = setInterval(() => {

                countdown--;

                if (countdown <= 0) {

                    clearInterval(timer);

                    btn.disabled = false;
                    btn.innerText = "Send Code";

                    return;
                }

                btn.innerText = `Resend ${countdown}s`;

            }, 1000);
        }

        async function sendCode() {

            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("sendCodeBtn");

            if (!email) {
                showMsg("Enter email first", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {

                const res = await fetch(API_BASE + "/api/send-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {

                    showMsg("Code sent", "success");
                    document.getElementById("code").focus();

                    startCountdown();

                } else {

                    showMsg(data.message || "Failed", "error");

                    btn.disabled = false;
                    btn.innerText = "Send Code";
                }

            } catch (error) {

                showMsg("Network error", "error");

                btn.disabled = false;
                btn.innerText = "Send Code";
            }
        }

        async function register() {

            const email = document.getElementById("email").value.trim();
            const code = document.getElementById("code").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email) {
                showMsg("Enter email", "error");
                return;
            }

            if (!code) {
                showMsg("Enter code", "error");
                return;
            }

            if (!password) {
                showMsg("Enter password", "error");
                return;
            }

            try {

                const res = await fetch(API_BASE + "/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        code: code
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {

                    showMsg("Registered successfully", "success");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 800);

                } else {

                    showMsg(data.message || "Register failed", "error");
                }

            } catch (error) {

                showMsg("Network error", "error");
            }

        }

    </script>

</body>

</html>
