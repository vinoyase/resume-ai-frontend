<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #c7e9ff, #e6f6ff);
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #f1f5f9;
        }

        h2 {
            margin: 0 0 22px;
            text-align: center;
            font-size: 30px;
            color: #111827;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            margin-top: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #ffffff;
            outline: none;
        }

        input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.18);
        }

        .emailRow {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-top: 12px;
        }

        .emailRow input {
            flex: 1;
            margin-top: 0;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3b7bf0;
        }

        .codeBtn {
            width: 118px;
            height: 46px;
            margin-top: 0;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #111827;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .codeBtn:hover {
            background: #f9fafb;
        }

        .codeBtn:disabled {
            color: #6b7280;
            background: #f8fafc;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        p {
            text-align: center;
            font-size: 14px;
            margin-top: 18px;
            margin-bottom: 0;
            color: #6b7280;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .box {
                padding: 24px;
            }

            .emailRow {
                flex-direction: column;
                align-items: stretch;
            }

            .codeBtn {
                width: 100%;
                margin-top: 0;
            }
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Create account</h2>

        <div class="emailRow">
            <input id="email" placeholder="Email">
            <button class="codeBtn" id="sendCodeBtn" onclick="sendCode()">Send code</button>
        </div>

        <input id="code" placeholder="Verification code">

        <input id="password" type="password" placeholder="Password">

        <button onclick="register()">Create account</button>

        <div id="msg" class="message"></div>

        <p>Already have an account? <a href="login.html">Sign in</a></p>

    </div>

    <script>

        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        let countdown = 0;
        let timer = null;

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        function startCountdown() {

            const btn = document.getElementById("sendCodeBtn");

            countdown = 60;

            btn.disabled = true;
            btn.innerText = `Resend ${countdown}s`;

            timer = setInterval(() => {

                countdown--;

                if (countdown <= 0) {

                    clearInterval(timer);

                    btn.disabled = false;
                    btn.innerText = "Send code";

                    return;
                }

                btn.innerText = `Resend ${countdown}s`;

            }, 1000);
        }

        async function sendCode() {

            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("sendCodeBtn");

            if (!email) {
                showMsg("Enter email first", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {

                const res = await fetch(API_BASE + "/api/send-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {

                    showMsg("Code sent", "success");
                    document.getElementById("code").focus();

                    startCountdown();

                } else {

                    showMsg(data.message || "Failed", "error");

                    btn.disabled = false;
                    btn.innerText = "Send code";
                }

            } catch (error) {

                showMsg("Network error", "error");

                btn.disabled = false;
                btn.innerText = "Send code";
            }
        }

        async function register() {

            const email = document.getElementById("email").value.trim();
            const code = document.getElementById("code").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email) {
                showMsg("Enter email", "error");
                return;
            }

            if (!code) {
                showMsg("Enter code", "error");
                return;
            }

            if (!password) {
                showMsg("Enter password", "error");
                return;
            }

            try {

                const res = await fetch(API_BASE + "/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        code: code
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {

                    showMsg("Registered successfully", "success");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 800);

                } else {

                    showMsg(data.message || "Register failed", "error");
                }

            } catch (error) {

                showMsg("Network error", "error");
            }

        }

    </script>

</body>

</html>
