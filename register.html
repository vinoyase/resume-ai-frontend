<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>
<body>

<h2>Register</h2>

<input id="email" placeholder="Email"><br><br>

<button id="sendCodeBtn" onclick="sendCode()">Send Verification Code</button><br><br>

<input id="code" placeholder="Verification Code"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>

<p>Already have an account? <a href="login.html">Login</a></p>

<script>
const API_BASE = "https://resume-ai-saas-4.onrender.com";

let countdown = 0;
let timer = null;

function startCountdown() {
    const btn = document.getElementById("sendCodeBtn");

    countdown = 60;
    btn.disabled = true;
    btn.innerText = `Resend in ${countdown}s`;

    timer = setInterval(() => {
        countdown--;

        if (countdown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = "Send Verification Code";
            return;
        }

        btn.innerText = `Resend in ${countdown}s`;
    }, 1000);
}

async function sendCode() {
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("sendCodeBtn");

    if (!email) {
        alert("Please enter email first");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Sending...";

    try {
        const res = await fetch(API_BASE + "/api/send-code", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email
            })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert("Verification code sent! Please check your email.");
            document.getElementById("code").focus();
            startCountdown();
        } else {
            alert(data.message || "Failed to send code");
            btn.disabled = false;
            btn.innerText = "Send Verification Code";
        }

    } catch (error) {
        alert("Network error, please try again");
        btn.disabled = false;
        btn.innerText = "Send Verification Code";
    }
}

async function register() {
    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email) {
        alert("Please enter email");
        return;
    }

    if (!code) {
        alert("Please enter verification code");
        return;
    }

    if (!password) {
        alert("Please enter password");
        return;
    }

    try {
        const res = await fetch(API_BASE + "/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password,
                code: code
            })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            alert("Registration successful! Please login.");
            window.location.href = "login.html";
        } else {
            alert(data.message || "Registration failed");
        }

    } catch (error) {
        alert("Network error, please try again");
    }
}
</script>

</body>
</html>
