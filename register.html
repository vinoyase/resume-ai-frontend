<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account - SmartResume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --card-border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --input-border: #d1d5db;
            --input-bg: #f9fafb;
            --success: #16a34a;
            --error: #dc2626;
            --shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-wrap {
            width: 100%;
            max-width: 440px;
        }

        .box {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px 28px 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.22);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1px;
            color: var(--text);
        }

        h2 {
            margin: 0;
            text-align: center;
            font-size: 28px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 8px;
            color: #334155;
        }

        .field {
            margin-top: 14px;
        }

        .emailRow {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .email-input-wrap {
            flex: 1;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 14px;
            font-family: "Inter", sans-serif;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.18);
            background: #ffffff;
        }

        .codeBtn {
            width: 132px;
            height: 50px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
            flex-shrink: 0;
            font-family: "Inter", sans-serif;
        }

        .codeBtn:hover {
            background: #ffffff;
            border-color: #c4b5fd;
            color: #6d28d9;
        }

        .codeBtn:disabled {
            background: #f8fafc;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }

        .primaryBtn {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.22);
        }

        .primaryBtn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(124, 58, 237, 0.24);
        }

        .message {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            min-height: 22px;
            font-weight: 500;
        }

        .error {
            color: var(--error);
        }

        .success {
            color: var(--success);
        }

        .bottom {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 0;
            color: var(--muted);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .trust {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .box {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }

            h2 {
                font-size: 25px;
            }

            .subtitle {
                margin-bottom: 20px;
            }

            .emailRow {
                flex-direction: column;
                align-items: stretch;
            }

            .codeBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="auth-wrap">
        <div class="box">

            <div class="brand">
                <div class="brand-badge">SR</div>
                <div class="brand-name">SmartResume</div>
            </div>

            <h2>Create your account</h2>
            <div class="subtitle">
                Create a professional resume in minutes.
            </div>

            <div class="field">
                <div class="emailRow">
                    <div class="email-input-wrap">
                        <label class="label" for="email">Email</label>
                        <input id="email" type="email" placeholder="you@example.com" />
                    </div>
                    <button class="codeBtn" id="sendCodeBtn" onclick="sendCode()">Get code</button>
                </div>
            </div>

            <div class="field">
                <label class="label" for="code">Verification code</label>
                <input id="code" placeholder="Enter the 6-digit code" />
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <input id="password" type="password" placeholder="Create a secure password" />
            </div>

            <button class="primaryBtn" onclick="register()">Create account</button>

            <div id="msg" class="message"></div>

            <p class="bottom">Already have an account? <a href="login.html">Sign in</a></p>


        </div>
    </div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        let countdown = 0;
        let timer = null;

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        function startCountdown() {
            const btn = document.getElementById("sendCodeBtn");

            countdown = 60;
            btn.disabled = true;
            btn.innerText = `Resend ${countdown}s`;

            timer = setInterval(() => {
                countdown--;

                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Send code";
                    return;
                }

                btn.innerText = `Resend ${countdown}s`;
            }, 1000);
        }

        async function sendCode() {
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("sendCodeBtn");

            if (!email) {
                showMsg("Enter your email first", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const res = await fetch(API_BASE + "/api/send-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showMsg("Verification code sent successfully", "success");
                    document.getElementById("code").focus();
                    startCountdown();
                } else {
                    showMsg(data.message || "Failed to send code", "error");
                    btn.disabled = false;
                    btn.innerText = "Send code";
                }
            } catch (error) {
                showMsg("Network error", "error");
                btn.disabled = false;
                btn.innerText = "Send code";
            }
        }

        async function register() {
            const email = document.getElementById("email").value.trim();
            const code = document.getElementById("code").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email) {
                showMsg("Enter your email", "error");
                return;
            }

            if (!code) {
                showMsg("Enter verification code", "error");
                return;
            }

            if (!password) {
                showMsg("Enter your password", "error");
                return;
            }

            try {
                const res = await fetch(API_BASE + "/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        code: code
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showMsg("Registered successfully", "success");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 900);
                } else {
                    showMsg(data.message || "Register failed", "error");
                }
            } catch (error) {
                showMsg("Network error", "error");
            }
        }
    </script>

</body>

</html>
