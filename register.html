<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>
<body>

<h2>Register</h2>

<input id="email" placeholder="Email"><br><br>

<button onclick="sendCode()">Send Verification Code</button><br><br>

<input id="code" placeholder="Verification Code"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>

<p>Already have an account? <a href="login.html">Login</a></p>

<script>

const API_BASE = "https://resume-ai-saas-4.onrender.com";

/* 发送验证码 */
async function sendCode() {

    const email = document.getElementById("email").value;

    if (!email) {
        alert("Please enter email first");
        return;
    }

    const res = await fetch(API_BASE + "/api/send-code", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("Verification code sent to your email");
    } else {
        alert(data.message || "Failed to send code");
    }
}


/* 注册 */
async function register() {

    const res = await fetch(API_BASE + "/api/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            code: document.getElementById("code").value
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("Registration successful! Please login.");
        window.location.href = "login.html";
    } else {
        alert(data.message || "Registration failed");
    }
}

</script>

</body>
</html>
