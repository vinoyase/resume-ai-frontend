<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password - SmartResume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: #eef4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 34px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .brand span {
            font-weight: 600;
            font-size: 16px;
        }

        h2 {
            margin: 0 0 22px;
            text-align: center;
            font-size: 26px;
            color: #111827;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
            color: #111827;
        }

        .field {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fbff;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
            background: white;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .hint {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: -8px;
            margin-bottom: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="brand">
            <div class="badge">AI</div>
            <span>SmartResume AI</span>
        </div>

        <h2>Create new password</h2>
        <div class="hint">Enter your new password below.</div>

        <div class="field">
            <label for="password">New password</label>
            <input id="password" type="password" placeholder="Enter new password">
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" placeholder="Confirm new password">
        </div>

        <button onclick="resetPassword()">Reset password</button>

        <div id="msg" class="message"></div>

        <div class="footer">
            <a href="login.html">Back to sign in</a>
        </div>

    </div>

    <script>
        const API_BASE = "https://resume-ai-saas-4.onrender.com";

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = "message " + type;
        }

        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get("token");
        }

        async function resetPassword() {
            const token = getTokenFromUrl();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();

            if (!token) {
                showMsg("Invalid reset link", "error");
                return;
            }

            if (!password) {
                showMsg("Enter new password", "error");
                return;
            }

            if (password.length < 6) {
                showMsg("Password must be at least 6 characters", "error");
                return;
            }

            if (!confirmPassword) {
                showMsg("Confirm your password", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMsg("Passwords do not match", "error");
                return;
            }

            try {
                const res = await fetch(API_BASE + "/api/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token,
                        password
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showMsg("Password reset successful", "success");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                } else {
                    showMsg(data.message || "Reset failed", "error");
                }

            } catch (error) {
                showMsg("Network error", "error");
                console.error(error);
            }
        }
    </script>

</body>

</html>
